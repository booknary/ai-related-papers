<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <hbox align="center">
    <html:img
      src="chrome://__addonRef__/content/icons/icon32.png"
      width="32"
      height="32"
      alt=""
      style="margin-inline-end: 8px"
    />
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-maxCandidates"
      data-l10n-id="pref-max-candidates"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="50"
      id="zotero-prefpane-__addonRef__-maxCandidates"
      preference="maxCandidates"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-minScorePercent"
      data-l10n-id="pref-min-score-percent"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-minScorePercent"
      preference="minScorePercent"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-searchScope"
      data-l10n-id="pref-search-scope"
    ></html:label>
    <html:select
      id="zotero-prefpane-__addonRef__-searchScope"
      preference="searchScope"
    >
      <html:option
        value="collection"
        data-l10n-id="pref-search-scope-collection"
      ></html:option>
      <html:option
        value="collectionRecursive"
        data-l10n-id="pref-search-scope-recursive"
      ></html:option>
      <html:option
        value="library"
        data-l10n-id="pref-search-scope-library"
      ></html:option>
    </html:select>
  </hbox>
  <label><html:h3 data-l10n-id="pref-local-weights"></html:h3></label>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-titleWeight"
      data-l10n-id="pref-title-weight"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-titleWeight"
      preference="titleWeight"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-abstractWeight"
      data-l10n-id="pref-abstract-weight"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-abstractWeight"
      preference="abstractWeight"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-authorWeight"
      data-l10n-id="pref-author-weight"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-authorWeight"
      preference="authorWeight"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-tagWeight"
      data-l10n-id="pref-tag-weight"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-tagWeight"
      preference="tagWeight"
    ></html:input>
  </hbox>
  <label><html:h3 data-l10n-id="pref-ai-scoring"></html:h3></label>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiEnabled"
      data-l10n-id="pref-ai-enabled"
    ></html:label>
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-aiEnabled"
      preference="aiEnabled"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiBaseURL"
      data-l10n-id="pref-ai-base-url"
    ></html:label>
    <html:input
      type="url"
      id="zotero-prefpane-__addonRef__-aiBaseURL"
      preference="aiBaseURL"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiAPIKey"
      data-l10n-id="pref-ai-api-key"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-aiAPIKey"
      preference="aiAPIKey"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiModel"
      data-l10n-id="pref-ai-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-aiModel"
      preference="aiModel"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiThinkingEnabled"
      data-l10n-id="pref-ai-thinking-enabled"
    ></html:label>
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-aiThinkingEnabled"
      preference="aiThinkingEnabled"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-aiReasoningEffort"
      data-l10n-id="pref-ai-reasoning-effort"
    ></html:label>
    <html:select
      id="zotero-prefpane-__addonRef__-aiReasoningEffort"
      preference="aiReasoningEffort"
    >
      <html:option
        value="low"
        data-l10n-id="pref-ai-reasoning-low"
      ></html:option>
      <html:option
        value="medium"
        data-l10n-id="pref-ai-reasoning-medium"
      ></html:option>
      <html:option
        value="high"
        data-l10n-id="pref-ai-reasoning-high"
      ></html:option>
    </html:select>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiScoreWeightPercent"
      data-l10n-id="pref-ai-score-weight"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="100"
      id="zotero-prefpane-__addonRef__-aiScoreWeightPercent"
      preference="aiScoreWeightPercent"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiCandidateLimit"
      data-l10n-id="pref-ai-candidate-limit"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="50"
      id="zotero-prefpane-__addonRef__-aiCandidateLimit"
      preference="aiCandidateLimit"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-aiTagCount"
      data-l10n-id="pref-ai-tag-count"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="20"
      id="zotero-prefpane-__addonRef__-aiTagCount"
      preference="aiTagCount"
    ></html:input>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
